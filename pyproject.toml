[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "drummer-research"
version = "0.1.0"
description = "Reproducible experiments in learned communication and contextual omission"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{name = "Luke Steuber", email = "luke@lukesteuber.com"}]
dependencies = [
  "torch>=2.14,<2.15",
  "numpy>=2.4,<3",
  "safetensors>=0.8,<0.9",
  "huggingface-hub>=1.6,<2",
  "jsonschema>=4.26,<5",
  "markdown-it-py>=4,<5",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[project.scripts]
drummer = "drummer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drummer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
